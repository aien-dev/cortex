[package]
name = "jnoracle"
version = "0.1.0"
edition = "2021"
[dependencies]
serde_json = { version = "=1.0.151", features = ["raw_value"] }
ryu = "=1.0.23"
zmij = "=1.0.23"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
uuid = { version = "=1.26.1" }
serde_path_to_error = "=0.1.20"
serde = { version = "1", features = ["derive"] }
[profile.release]
debug = false
